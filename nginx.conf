# Astral Projection LG — nginx config
#
# Two things matter for this app:
#   1. Correct MIME types for audio/webmanifest so the player and PWA bootstrap work.
#   2. No-cache on sw.js so updates to the service worker propagate without
#      users needing a hard refresh (we use skipWaiting() in the SW itself).

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html de.html;

    # Long cache for fingerprinted static assets (icons, audio).
    # If you ever add hashed filenames (app.abc123.js), add them here.
    location ~* \.(?:ogg|opus|mp3|wav|m4a|png|jpg|jpeg|svg|webp|ico)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # Service worker must NEVER be cached — every page load must revalidate so
    # a new SW can take over and call skipWaiting().
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # Manifest same as sw.js — PWA installs depend on it being current.
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # HTML pages also no-cache so content updates propagate.
    location ~* \.html$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # Mime types — nginx alpine's default already covers most, but be explicit
    # because mp4 audio/m4a audio sometimes slip through as video/mp4.
    types {
        audio/ogg      opus oga;
        audio/mpeg     mp3;
        audio/wav      wav;
        audio/mp4      m4a;
        application/manifest+json  webmanifest;
    }
    default_type application/octet-stream;

    # SPA-ish fallback is NOT needed — both index.html and de.html exist on disk.
    # But if a user hits /random-path, send them home rather than 404.
    error_page 404 /index.html;

    # Compress text-y things on the fly (audio is already small, no compression there)
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        application/xml
        image/svg+xml;

    # Security headers — light touch, anything stronger would interfere with PWA semantics
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Allow .opus / .mp3 / etc. to be loaded by the page even though the page is https
    add_header Cross-Origin-Resource-Policy "cross-origin" always;
}
